name: Detection report (false positive / false negative)
description: Veil flagged something harmless, or missed something sensitive.
labels: [detection, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Do not paste real data.** No real API keys, passwords, ID numbers, card numbers, customer
        data or confidential text, not even partially masked. Write a **fake example with the same
        shape** (same length, separators, prefix, language), e.g. `X-1234567-L` instead of a real NIE.
        Issues with real data are deleted.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [False positive (flagged but harmless), False negative (missed)]
    validations: { required: true }
  - type: dropdown
    id: layer
    attributes:
      label: What reported it (or should have)
      options: [Keyword (L1), Personal data / secret pattern (L2), AI check (L3), Not sure]
    validations: { required: true }
  - type: input
    id: type
    attributes:
      label: Detection type shown (if any)
      placeholder: e.g. "a phone number", "proprietary source code"
  - type: textarea
    id: example
    attributes:
      label: Fake example with the same shape
      render: text
    validations: { required: true }
  - type: input
    id: language
    attributes:
      label: Language and country of the content
      placeholder: Spanish (ES)
  - type: input
    id: source
    attributes:
      label: Where (message, pasted text, file type, image)
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: The example above contains no real personal data, secrets or confidential information.
          required: true
