[package]
name = "veil-platform-linux"
description = "Veil platform provider for Linux (X11 and Wayland)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
veil-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
libc = "0.2"
# Kernel input: grab real devices, re-emit through uinput.
evdev = "0.13"
# X11: active window, window under pointer, XDND selection, activation. Pure Rust.
x11rb = { version = "0.13", features = ["xfixes"] }
# AT-SPI over the accessibility bus. Pure Rust D-Bus (no libdbus).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Clipboard (X11 + wlr/ext data-control on Wayland). Pure Rust.
arboard = { version = "3.7", features = ["wayland-data-control"] }
# Typing warnings as desktop notifications (zbus backend).
notify-rust = { version = "4.18", default-features = false, features = ["z"] }
png = "0.18"
percent-encoding = "2"

[dev-dependencies]
