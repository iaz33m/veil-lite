[package]
name = "veil-platform-macos"
description = "Veil platform provider for macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
veil-core.workspace = true
tracing.workspace = true
parking_lot.workspace = true

# Everything below is only compiled on macOS; on other systems this crate is an empty library.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
accessibility-sys = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-vision = "0.3"
dispatch2 = "0.3"
