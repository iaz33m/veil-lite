[package]
name = "veil-detect"
description = "Veil detection layers: keywords, personal-data patterns, file extraction, on-device AI checks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["model"]
# Layer 3: on-device AI checks via ONNX Runtime (loaded dynamically at run time).
model = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

[dependencies]
anyhow.workspace = true
veil-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
regex.workspace = true
aho-corasick.workspace = true
unicode-normalization.workspace = true
sha2.workspace = true
hex.workspace = true
redact-core.workspace = true
zip.workspace = true
quick-xml.workspace = true
pdf-extract.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
