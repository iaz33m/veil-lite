[package]
name = "veil-engine"
description = "Veil engine: headless background process that intercepts and checks outgoing content"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "veil_engine"
path = "src/lib.rs"

[[bin]]
name = "veil-engine"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
veil-core.workspace = true
veil-detect.workspace = true
veil-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }

[target.'cfg(target_os = "macos")'.dependencies]
veil-platform-macos.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
veil-platform-windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
veil-platform-linux.workspace = true

[dev-dependencies]
veil-core = { workspace = true, features = ["testing"] }
tempfile = "3"

[build-dependencies]
embed-manifest = "1.5"
