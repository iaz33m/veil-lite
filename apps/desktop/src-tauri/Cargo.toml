[package]
name = "veil-desktop"
description = "Veil desktop app: tray, setup wizard, settings and activity for the Veil engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/veil-dlp/veil"
publish = false
default-run = "veil-desktop"

[lib]
name = "veil_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.6"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = { version = "2.14", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
veil-core = { path = "../../../crates/veil-core" }
veil-ipc = { path = "../../../crates/veil-ipc" }

[features]
# Self-update through tauri-plugin-updater. Off until release signing and an update endpoint exist.
updater = ["dep:tauri-plugin-updater"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
